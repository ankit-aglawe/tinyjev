[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyjev"
version = "0.1.0"
description = "Run tiny Jev-style decision models locally: NanoJev and Kev on MLX (Apple Silicon) or PyTorch (CPU/CUDA/MPS), one System One endpoint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ankit Aglawe" }]
keywords = ["jev", "kev", "nanojev", "decision-model", "system-one", "typesafe", "mlx", "apple-silicon", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tokenizers>=0.15",
  "safetensors>=0.4",
  "numpy>=1.24",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
mlx = ["mlx>=0.22", "mlx-lm>=0.20"]
torch = ["torch>=2.2", "transformers>=4.45"]
convert = ["torch>=2.2", "safetensors>=0.4"]
demo = ["pillow>=10"]
dev = ["pytest>=8", "pillow>=10", "torch>=2.2", "transformers>=4.45"]

[project.scripts]
tinyjev = "tinyjev.cli:main"

[project.urls]
Homepage = "https://github.com/ankit-aglawe/tinyjev"
Upstream = "https://github.com/TianyuCodings/NanoJev"

[tool.setuptools.packages.find]
include = ["tinyjev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
